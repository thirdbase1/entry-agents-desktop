[package]
name = "entry-desktop"
version = "1.3.1"
edition = "2021"
description = "Entry Desktop — Native Windows WebView2 Shell (No Electron)"

[[bin]]
name = "entry-desktop"
path = "src/main.rs"

[dependencies]
tao = "0.30"
wry = "0.47"
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
